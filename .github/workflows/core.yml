# The Go core, the React wrapper, and a distribution dry run. Nothing here
# publishes; release.yml does that when a version tag is pushed.
name: core

on:
  push:
    paths: ["core/**", "packages/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "packages/**", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: make check

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  dist-dry-run:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make dist-check
