name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      - name: Test
        run: npm test

      - name: Validate examples and process docs
        run: node bin/dossier.mjs validate examples/*.dossier.json docs/product/process-dossiers/process-dossiers-scope.dossier.json

      - name: Package dry run
        run: npm pack --dry-run

      - name: Resolve version
        id: version
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
              exit 1
            fi
          fi

          set +e
          view_output="$(npm view "$name@$version" version --json 2>&1)"
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; skipping npm publish."
          elif grep -q "E404" <<<"$view_output"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$view_output" >&2
            echo "Could not determine whether $name@$version is already published." >&2
            exit "$view_status"
          fi

      - name: Publish
        if: ${{ steps.version.outputs.published != 'true' }}
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "Using the NPM_TOKEN secret for authentication."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            echo "No NPM_TOKEN secret; publishing through npm trusted publishing (OIDC)."
          fi
          npm publish --provenance --access public

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          tag="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} does not exist; skipping the GitHub release." >&2
            exit 0
          fi

          notes="Published \`${NAME}@${VERSION}\` to npm with provenance."
          evidence="docs/releases/${VERSION}.dossier.json"
          if [[ -f "$evidence" ]]; then
            notes="${notes}"$'\n\n'"Release evidence: [\`${evidence}\`](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/${evidence})"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Dossier ${tag}" --notes "$notes"
          else
            gh release create "$tag" --title "Dossier ${tag}" --notes "$notes" --verify-tag
          fi
